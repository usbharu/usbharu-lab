name: Validate GitOps configuration
on:
  push:
    branches: [komodo]
  pull_request:
    branches: [komodo]
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --quiet pyyaml
      - run: .venv/bin/python scripts/check-config.py
