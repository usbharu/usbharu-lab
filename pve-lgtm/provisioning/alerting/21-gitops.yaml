apiVersion: 1
groups:
- orgId: 1
  name: gitops
  folder: Alerts
  interval: 1m
  rules:
  - uid: gitops-heartbeat-stale
    title: GitopsHeartbeatStale
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: time() - gitops_last_success_timestamp_seconds
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 900
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: GitOps Procedure が 15 分間成功していません
      description: Komodo の usbharu-lab-gitops の実行履歴、スケジュール、Periphery、GitHub Webhook を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#gitops
    labels:
      severity: warning
      category: gitops
      issue: '155'
  - uid: gitops-last-run-failed
    title: GitopsLastRunFailed
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: gitops_state{state="failed"}
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: OK
    execErrState: Alerting
    for: 5m
    annotations:
      summary: GitOps Procedure の直近の実行が失敗しています
      description: Komodo の Procedure 実行結果で失敗した stage を確認してください。failure_alert の通知経路も確認します。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#gitops
    labels:
      severity: critical
      category: gitops
      issue: '155'
  - uid: gitops-schedule-disabled
    title: GitopsScheduleDisabled
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: gitops_schedule_enabled
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: GitOps Procedure のスケジュールが無効です
      description: komodo/resources.toml の schedule_enabled と Komodo UI の設定を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#gitops
    labels:
      severity: warning
      category: gitops
      issue: '155'
  - uid: gitops-canary-stale
    title: GitopsCanaryStale
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: time() - max(gitops_canary_timestamp_seconds)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 600
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: GitOps heartbeat canary が停止しています
      description: LXC 200 の lgtm-gitops-canary.timer と Komodo API の疎通を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#gitops
    labels:
      severity: critical
      category: gitops
      issue: '155'
  - uid: gitops-api-failing
    title: GitopsApiFailing
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: gitops_api_ok
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: Komodo API から Procedure 状態を取得できません
      description: API キー、公開 URL、Komodo Core の状態を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#gitops
    labels:
      severity: warning
      category: gitops
      issue: '155'
