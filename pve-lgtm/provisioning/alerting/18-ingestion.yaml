apiVersion: 1

groups:
  - orgId: 1
    name: ingestion
    folder: Alerts
    interval: 1m
    rules:
      - uid: loki-ingestion-stopped
        title: LokiIngestionStopped
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: 'sum(rate(loki_distributor_lines_received_total[5m]))'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.001
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: 'Loki のログ取り込みが停止しています'
          description: 'loki_distributor_lines_received_total の 5 分レートが 0 です。Loki、Collector、テナント設定、ディスク、送信経路を確認してください。'
          runbook_url: 'https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#ingestion'
          dashboard_uid: lgtm
        labels:
          severity: warning
          category: ingestion
          issue: '161'
      - uid: mimir-ingestion-stopped
        title: MimirIngestionStopped
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: 'sum(rate(cortex_distributor_received_samples_total[5m]))'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.001
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: 'Mimir のメトリクス取り込みが停止しています'
          description: 'cortex_distributor_received_samples_total の 5 分レートが 0 です。Mimir、Collector、送信経路を確認してください。'
          runbook_url: 'https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#ingestion'
          dashboard_uid: lgtm
        labels:
          severity: warning
          category: ingestion
          issue: '161'
      - uid: tempo-ingestion-stopped
        title: TempoIngestionStopped
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: 'sum(rate(tempo_distributor_spans_received_total[5m]))'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.001
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 15m
        annotations:
          summary: 'Tempo のトレース取り込みが停止しています'
          description: 'tempo_distributor_spans_received_total の 5 分レートが 0 です。Tempo、Collector、送信経路を確認してください。'
          runbook_url: 'https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#ingestion'
          dashboard_uid: lgtm
        labels:
          severity: warning
          category: ingestion
          issue: '161'
