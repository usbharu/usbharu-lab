apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-alerts
        type: discord
        disableResolveMessage: false
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: false
          title: '{{ template "usbharu-lab.title" . }}'
          message: '{{ template "usbharu-lab.message" . }}'
