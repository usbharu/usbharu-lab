apiVersion: 1

groups:
  - orgId: 1
    name: pve-hardware
    folder: Alerts
    interval: 1m
    rules:
      - uid: pve-smart-health
        title: PveSmartHealth
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: 'pve_disk_health_status'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: '{{ $labels.node }} {{ $labels.device }} ({{ $labels.model }}) の SMART 異常'
          description: 'SMART の健康状態が 1 未満です。smartctl -a で詳細を確認し、交換を検討してください。'
          runbook_url: 'https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#pve-hardware'
          dashboard_uid: proxmox-ve
        labels:
          severity: critical
          category: pve-hardware
          issue: '153'
      - uid: pve-disk-temp-sata
        title: PveDiskTempSata
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: 'pve_disk_temperature_celsius{type=~"sata|unknown"}'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 15m
        annotations:
          summary: '{{ $labels.node }} {{ $labels.device }} の温度が {{ $value }}°C です'
          description: 'SATA / 不明タイプのディスク温度が 60°C を超えています。冷却とエアフローを確認してください。'
          runbook_url: 'https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#pve-hardware'
          dashboard_uid: proxmox-ve
        labels:
          severity: warning
          category: pve-hardware
          issue: '153'
