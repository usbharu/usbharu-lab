apiVersion: 1

templates:
  - orgId: 1
    name: usbharu-lab
    template: |
      {{ define "usbharu-lab.title" }}[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ end }}
      {{ define "usbharu-lab.message" }}
      {{ range .Alerts }}
      **{{ .Annotations.summary }}**
      {{ .Annotations.description }}
      severity: `{{ .Labels.severity }}` / issue: #{{ .Labels.issue }}
      {{ end }}
      {{ end }}
