apiVersion: 1
groups:
- orgId: 1
  name: canary
  folder: Alerts
  interval: 1m
  rules:
  - uid: lgtm-metric-canary-stale
    title: LgtmMetricCanaryStale
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: time() - max(lgtm_canary_timestamp_seconds)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 300
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: Mimir への canary メトリクスが届いていません
      description: Collector、Mimir、OTLP 経路を確認してください。Loki / Tempo の canary と合わせて取り込み全体を検証します。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#canary
    labels:
      severity: critical
      category: canary
      issue: '161'
  - uid: lgtm-log-canary-missing
    title: LgtmLogCanaryMissing
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      queryType: instant
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service_name="lgtm-canary"}[5m]))
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: Loki に canary ログがありません
      description: Loki の取り込み、Collector のログ pipeline、テナント設定、ディスクを確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#canary
    labels:
      severity: critical
      category: canary
      issue: '161'
  - uid: lgtm-log-canary-invisible
    title: LgtmLogCanaryInvisible
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: min(lgtm_canary_log_visible)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: canary ログを Loki から検索できません
      description: 書き込みは成功しているのに検索できない場合、Loki の index / querier / テナント設定を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#canary
    labels:
      severity: critical
      category: canary
      issue: '161'
  - uid: lgtm-trace-canary-invisible
    title: LgtmTraceCanaryInvisible
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: min(lgtm_canary_trace_visible)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 10m
    annotations:
      summary: canary トレースを Tempo から検索できません
      description: Tempo の取り込み、compaction、querier、Collector の traces pipeline を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#canary
    labels:
      severity: critical
      category: canary
      issue: '161'
  - uid: lgtm-mimir-canary-invisible
    title: LgtmMimirCanaryInvisible
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: min(lgtm_canary_mimir_visible)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: canary メトリクスを Mimir から検索できません
      description: Mimir の distributor / ingester / querier と Collector の metrics pipeline を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#canary
    labels:
      severity: critical
      category: canary
      issue: '161'
  - uid: external-monitor-stale
    title: ExternalMonitorStale
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: time() - max(external_monitor_last_run_timestamp_seconds)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 600
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 0s
    annotations:
      summary: 外部 dead-man switch の heartbeat がありません
      description: ocms-ubuntu VPS の lab-external-monitor.timer と WireGuard 経路を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#external-monitor
    labels:
      severity: critical
      category: canary
      issue: '148'
  - uid: external-check-failing
    title: ExternalCheckFailing
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        editorMode: code
        expr: min(external_monitor_check_success)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        refId: A
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: 外部監視のチェックが失敗しています ({{ $labels.check }})
      description: 外部 VPS から自宅 LAN の公開 URL / OTLP に到達できません。回線、Cloudflare Tunnel、LXC 200 を確認してください。
      runbook_url: https://github.com/usbharu/usbharu-lab/blob/komodo/pve-lgtm/ALERTING.md#external-monitor
    labels:
      severity: critical
      category: canary
      issue: '148'
