apiVersion: 1

providers:
  - name: PVE
    orgId: 1
    folder: PVE
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/pve

  - name: usbharu-lab
    orgId: 1
    folder: usbharu-lab
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/usbharu-lab

  - name: LGTM
    orgId: 1
    folder: LGTM
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/lgtm
