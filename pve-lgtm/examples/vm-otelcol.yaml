# OTel Collector inside a Linux VM.
# Replace <VM_NAME> and <HOST_NAME>. The service name becomes the Loki
# service_name label used by the Journal & Kernel Logs dashboard.
#
# Install: otelcol-contrib 0.165.0 .deb, add the otelcol-contrib user to the
# systemd-journal group, write this file to /etc/otelcol-contrib/config.yaml,
# then: systemctl enable --now otelcol-contrib
receivers:
  journald:
    directory: /var/log/journal
    start_at: end
    priority: info

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource:
    attributes:
      - key: service.name
        value: <VM_NAME>-journald
        action: upsert
      - key: host.name
        value: <HOST_NAME>
        action: upsert
  # Optional: Docker's journald log driver keeps the container name in the
  # journal body. Route one container to its own service_name, replace the
  # journal wrapper with the container message, and drop repetitive noise.
  transform/docker:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], "ocis") where body["CONTAINER_NAME"] == "ocis"
          - set(body, body["MESSAGE"]) where body["CONTAINER_NAME"] == "ocis"
  filter/docker_noise:
    error_mode: ignore
    log_conditions:
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"message\":\"user .* authenticated\".*")'
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"message\":\"listing public shares\".*")'
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"message\":\"list public share\".*")'
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"message\":\"skipping auth check for: /app/list\".*")'
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"path\":\"/status.php\".*")'
      - 'resource.attributes["service.name"] == "ocis" and IsMatch(log.body, ".*\"path\":\"/ocs/v2.php/cloud/capabilities\".*")'
  batch:
    timeout: 5s
    send_batch_size: 4096

exporters:
  otlp:
    endpoint: 192.168.1.240:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [journald]
      processors: [memory_limiter, resource, transform/docker, filter/docker_noise, batch]
      exporters: [otlp]
