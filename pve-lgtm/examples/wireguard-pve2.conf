# /etc/wireguard/wg0.conf on PVE pve2 (192.168.1.250).
# Generate the private key on pve2 with `wg genkey`; never commit it.
#
# Also enable forwarding persistently:
#   echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-wireguard-forward.conf
#   sysctl -p /etc/sysctl.d/99-wireguard-forward.conf
[Interface]
Address = 10.0.0.3/32
PrivateKey = <PVE2_PRIVATE_KEY>
MTU = 1420
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -o vmbr0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -s 10.0.0.0/24 -o vmbr0 -j MASQUERADE

[Peer]
# ocms-ubuntu VPS (WireGuard hub)
PublicKey = <VPS_PUBLIC_KEY>
AllowedIPs = 10.0.0.1/32
Endpoint = <VPS_PUBLIC_IP>:51820
PersistentKeepalive = 25
