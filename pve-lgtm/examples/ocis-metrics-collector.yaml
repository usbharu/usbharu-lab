# oCIS metrics sidecar on VM101 (192.168.1.52).
#
# The prometheus receiver scrapes the oCIS proxy metrics endpoint. The
# docker_stats receiver adds container state, restart and uptime metrics so
# Grafana can detect a stopped or crash-looping oCIS container without cAdvisor.
#
# The container needs read-only access to /var/run/docker.sock. See
# pve-lgtm/README.md for the compose override.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ocis
          scrape_interval: 30s
          scrape_timeout: 10s
          metrics_path: /metrics
          static_configs:
            - targets: ["127.0.0.1:9205"]
          metric_relabel_configs:
            - target_label: instance
              replacement: ocis

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 10s
    metrics:
      container.cpu.usage.total:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.uptime:
        enabled: true
      container.restarts:
        enabled: true
      container.state.status:
        enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource:
    attributes:
      - key: service.name
        value: ocis
        action: upsert
      - key: host.name
        value: ocis
        action: upsert

  # Promote the Docker resource attributes to datapoint labels. Mimir keeps
  # resource attributes on target_info but not on every metric series, so the
  # alert rules need container_name on the datapoint.
  transform/container_labels:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["container_name"], resource.attributes["container.name"]) where attributes["container_name"] == nil

  batch:
    timeout: 5s
    send_batch_size: 4096

exporters:
  otlp_http/pve_lgtm:
    endpoint: http://192.168.1.240:4318

service:
  pipelines:
    metrics:
      receivers: [prometheus, docker_stats]
      processors: [memory_limiter, resource, transform/container_labels, batch]
      exporters: [otlp_http/pve_lgtm]
