# OTel Collector on pve3 VM 121 db-pve3.
# Sends host journald logs, PostgreSQL 17 file logs and host metrics to the
# central LGTM collector, which writes Loki/Mimir and forwards to New Relic.
#
# Install: otelcol-contrib 0.165.0 .deb, add the otelcol-contrib user to the
# systemd-journal and adm groups, write this file to
# /etc/otelcol-contrib/config.yaml, then: systemctl enable --now otelcol-contrib
receivers:
  journald:
    directory: /var/log/journal
    start_at: end
    priority: info

  filelog/postgresql:
    include: [/var/log/postgresql/*.log]
    start_at: beginning
    include_file_name: true
    include_file_path: true
    storage: file_storage
    multiline:
      line_start_pattern: '^\d{4}-\d{2}-\d{2} '
    operators:
      - type: regex_parser
        regex: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ \S+) \[(?P<pid>\d+)\] (?:(?P<user>\S*)@(?P<database>\S*) )?(?P<level>[A-Z]+):\s+(?P<message>.*)$'
        parse_from: body
        parse_to: attributes
        on_error: send
      - type: move
        from: attributes.message
        to: body
        if: 'attributes.message != nil'

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
      processes: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

  filter/noise:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, ".*\"SYSLOG_IDENTIFIER\":\"qemu-ga\".*")'
        - 'IsMatch(body, ".*user-runtime-dir@.*")'

  resource/journald:
    attributes:
      - key: service.name
        value: db-pve3-journald
        action: upsert
      - key: host.name
        value: db-pve3
        action: upsert
      - key: service.namespace
        value: usbharu-lab
        action: upsert

  resource/postgresql:
    attributes:
      - key: service.name
        value: postgresql
        action: upsert
      - key: host.name
        value: db-pve3
        action: upsert
      - key: service.namespace
        value: usbharu-lab
        action: upsert

  resource/host:
    attributes:
      - key: service.name
        value: db-pve3-host
        action: upsert
      - key: host.name
        value: db-pve3
        action: upsert
      - key: service.namespace
        value: usbharu-lab
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 4096

exporters:
  otlp:
    endpoint: 192.168.1.240:4317
    tls:
      insecure: true

extensions:
  file_storage:
    directory: /var/lib/otelcol-contrib/storage

service:
  extensions: [file_storage]
  pipelines:
    logs/journald:
      receivers: [journald]
      processors: [memory_limiter, filter/noise, resource/journald, batch]
      exporters: [otlp]
    logs/postgresql:
      receivers: [filelog/postgresql]
      processors: [memory_limiter, resource/postgresql, batch]
      exporters: [otlp]
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource/host, batch]
      exporters: [otlp]
