# Central OTel Collector in LXC 200 (lgtm).
# Receives OTLP from the PVE host, VMs, and ocms-ubuntu (all signals over WireGuard),
# scrapes pve-exporter and node_exporter, then writes metrics to Mimir, logs to
# Loki, and traces to Tempo. The same signals are also copied to New Relic (US).
#
# Replace the target addresses and vm/vmid labels when hosts change.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Go pve-exporter on the PVE hosts. Collection takes about 20 seconds,
  # so the scrape timeout is longer than the default 10 seconds.
  #
  # pve2 covers the cluster-wide Proxmox API (nodes, VMs, storage, HA).
  # pve3 only contributes local hardware (SMART, sensors, disk I/O, ZFS ARC)
  # because its API series would duplicate the ones already scraped from pve2.
  prometheus/pve:
    config:
      scrape_configs:
        - job_name: pve
          scrape_interval: 60s
          scrape_timeout: 50s
          metrics_path: /metrics
          static_configs:
            - targets: ['192.168.1.250:9221']
        - job_name: pve-local
          scrape_interval: 60s
          scrape_timeout: 50s
          metrics_path: /metrics
          static_configs:
            - targets: ['192.168.1.251:9221']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'pve_(disk|sensor|zfs_arc)_.*|pve_exporter_.*|up'
              action: keep

  # node_exporter inside the VMs. The instance label is normalized to the
  # guest hostname so the Node Exporter Full dashboard can select a VM by name.
  prometheus/vms:
    config:
      scrape_configs:
        - job_name: node
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['192.168.1.78:9100']
              labels:
                vm: picoclaw
                vmid: "100"
            - targets: ['192.168.1.52:9100']
              labels:
                vm: ocis
                vmid: "101"
          metric_relabel_configs:
            - source_labels: [vm]
              target_label: instance

  # LGTM stack self-monitoring. Keep only the series used by the LGTM dashboard.
  prometheus/lgtm:
    config:
      scrape_configs:
        - job_name: mimir
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['mimir:9009']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'cortex_(ingester_memory_series|ingester_memory_series_created_total|distributor_received_samples_total|ingester_received_samples_total|distributor_ingestion_rate_samples_per_second|querier_request_duration_seconds_(bucket|count)|query_frontend_.*|compactor_.*|build_info)|mimir_build_info|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: loki
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['loki:3100']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'loki_(distributor_bytes_received_total|distributor_lines_received_total|ingester_memory_streams|ingester_bytes_received_total|ingester_chunk_stored_bytes_total|request_duration_seconds_(bucket|count)|logql_query_duration_seconds_(bucket|count)|ingester_chunks_created_total|build_info)|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: tempo
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['tempo:3200']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'tempo_(distributor_spans_received_total|distributor_bytes_received_total|request_duration_seconds_(bucket|count)|query_frontend_.*|ingester_.*|build_info)|tempodb_.*|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: grafana
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['grafana:3000']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'grafana_(http_request_duration_seconds_(bucket|count)|http_request_in_flight|http_response_size_bytes|api_dataproxy_request_all_milliseconds|stat_active_users|stat_totals_dashboard|stat_totals_datasource|stat_total_users|stat_total_orgs|stat_total_playlists|build_info|alerting_alerts)|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: otelcol
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_.*|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 128
  # Label telemetry from the OCMS worker on the home LAN so it can be
  # distinguished from the worker on the VPS (lab_host=ocms-ubuntu).
  transform/remote_worker:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker" and attributes["service.namespace"] == nil
          - set(attributes["host.name"], "ocms-worker-vm110") where attributes["service.name"] == "worker" and attributes["service.namespace"] == "usbharu-lab" and attributes["host.name"] == nil
      - context: datapoint
        statements:
          - set(attributes["lab_host"], "ocms-worker-vm110") where resource.attributes["service.name"] == "worker" and resource.attributes["service.namespace"] == "usbharu-lab" and attributes["lab_host"] == nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker" and attributes["service.namespace"] == nil
          - set(attributes["host.name"], "ocms-worker-vm110") where attributes["service.name"] == "worker" and attributes["service.namespace"] == "usbharu-lab" and attributes["host.name"] == nil
    trace_statements:
      - context: resource
        statements:
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker" and attributes["service.namespace"] == nil
          - set(attributes["host.name"], "ocms-worker-vm110") where attributes["service.name"] == "worker" and attributes["service.namespace"] == "usbharu-lab" and attributes["host.name"] == nil
  # oCIS emits many internal helper spans from the gateway and ocdav. The
  # request-level RPC spans are enough for most investigations, so drop the
  # leaf spans that make up the bulk of the trace count.
  filter/ocis_noise:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "gateway" and name == "loadAttributes"'
        - 'resource.attributes["service.name"] == "gateway" and name == "ReadNode"'
        - 'resource.attributes["service.name"] == "gateway" and name == "ParentWithReader"'
        - 'resource.attributes["service.name"] == "gateway" and name == "Type"'
        - 'resource.attributes["service.name"] == "gateway" and name == "Child"'
        - 'resource.attributes["service.name"] == "gateway" and name == "getNodeIDFromCache"'
        - 'resource.attributes["service.name"] == "gateway" and name == "GetTreeSize"'
        - 'resource.attributes["service.name"] == "ocdav" and name == "md_to_prop_response"'
  filter/newrelic_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_WARN'
  # New Relic only: aggregate metrics over 5 minutes. Mimir keeps full resolution.
  # New Relic only: drop delta and non-monotonic sums; the interval processor
  # aggregates cumulative sums, gauges, histograms and summaries over 5 minutes.
  filter/newrelic_delta:
    error_mode: ignore
    metrics:
      metric:
        - 'metric.aggregation_temporality == AGGREGATION_TEMPORALITY_DELTA'
        - 'metric.type == METRIC_DATA_TYPE_SUM and metric.is_monotonic == false'
  interval/newrelic:
    interval: 5m
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  otlphttp/mimir:
    endpoint: http://mimir:9009/otlp
    # Preserve sample order; multiple consumers can make Mimir reject
    # cumulative counters as out-of-order.
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 1000
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # New Relic OTLP ingest (US region). The license key is read from the
  # container environment and never stored here. The collector fails to start
  # when NEW_RELIC_LICENSE_KEY is unset, so configure it before restarting.
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 500
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
                without_units: true
  extensions: [health_check]
  pipelines:
    metrics/mimir:
      receivers: [otlp, prometheus/pve, prometheus/vms, prometheus/lgtm]
      processors: [memory_limiter, transform/remote_worker, batch]
      exporters: [otlphttp/mimir]
    metrics/newrelic:
      receivers: [otlp, prometheus/pve, prometheus/vms, prometheus/lgtm]
      processors: [memory_limiter, transform/remote_worker, filter/newrelic_delta, interval/newrelic, batch]
      exporters: [otlphttp/newrelic]
    logs/loki:
      receivers: [otlp]
      processors: [memory_limiter, transform/remote_worker, batch]
      exporters: [otlphttp/loki]
    logs/newrelic:
      receivers: [otlp]
      processors: [memory_limiter, transform/remote_worker, filter/newrelic_logs, batch]
      exporters: [otlphttp/newrelic]
    traces/tempo:
      receivers: [otlp]
      processors: [memory_limiter, transform/remote_worker, filter/ocis_noise, batch]
      exporters: [otlp/tempo]
