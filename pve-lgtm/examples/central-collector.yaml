# Central OTel Collector in LXC 200 (lgtm).
# Receives OTLP from the PVE host, VMs, and ocms-ubuntu (metrics over WireGuard),
# scrapes pve-exporter and node_exporter, then writes metrics to Mimir, logs to
# Loki, and traces to Tempo.
#
# Replace the target addresses and vm/vmid labels when hosts change.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Go pve-exporter on the PVE host. Collection takes about 20 seconds,
  # so the scrape timeout is longer than the default 10 seconds.
  prometheus/pve:
    config:
      scrape_configs:
        - job_name: pve
          scrape_interval: 60s
          scrape_timeout: 50s
          metrics_path: /metrics
          static_configs:
            - targets: ['192.168.1.250:9221']

  # node_exporter inside the VMs. The instance label is normalized to the
  # guest hostname so the Node Exporter Full dashboard can select a VM by name.
  prometheus/vms:
    config:
      scrape_configs:
        - job_name: node
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['192.168.1.78:9100']
              labels:
                vm: picoclaw
                vmid: "100"
            - targets: ['192.168.1.52:9100']
              labels:
                vm: ocis
                vmid: "101"
          metric_relabel_configs:
            - source_labels: [vm]
              target_label: instance

  # LGTM stack self-monitoring. Keep only the series used by the LGTM dashboard.
  prometheus/lgtm:
    config:
      scrape_configs:
        - job_name: mimir
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['mimir:9009']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'cortex_(ingester_memory_series|ingester_memory_series_created_total|distributor_received_samples_total|ingester_received_samples_total|distributor_ingestion_rate_samples_per_second|querier_request_duration_seconds_(bucket|count)|query_frontend_.*|compactor_.*|build_info)|mimir_build_info|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: loki
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['loki:3100']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'loki_(distributor_bytes_received_total|distributor_lines_received_total|ingester_memory_streams|ingester_bytes_received_total|ingester_chunk_stored_bytes_total|request_duration_seconds_(bucket|count)|logql_query_duration_seconds_(bucket|count)|ingester_chunks_created_total|build_info)|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: tempo
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['tempo:3200']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'tempo_(distributor_spans_received_total|distributor_bytes_received_total|request_duration_seconds_(bucket|count)|query_frontend_.*|ingester_.*|build_info)|tempodb_.*|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: grafana
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['grafana:3000']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'grafana_(http_request_duration_seconds_(bucket|count)|http_request_in_flight|http_response_size_bytes|api_dataproxy_request_all_milliseconds|stat_active_users|stat_totals_dashboard|stat_totals_datasource|stat_total_users|stat_total_orgs|stat_total_playlists|build_info|alerting_alerts)|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep
        - job_name: otelcol
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ['127.0.0.1:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_.*|process_(cpu_seconds_total|resident_memory_bytes|open_fds)|up'
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 128
  # Label telemetry from the OCMS worker on the home LAN so it can be
  # distinguished from the worker on the VPS (lab_host=ocms-ubuntu).
  transform/remote_worker:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "ocms-worker-pve") where attributes["service.name"] == "worker"
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker"
      - context: datapoint
        statements:
          - set(attributes["lab_host"], "ocms-worker-pve") where resource.attributes["service.name"] == "worker"
    log_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "ocms-worker-pve") where attributes["service.name"] == "worker"
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker"
    trace_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], "ocms-worker-pve") where attributes["service.name"] == "worker"
          - set(attributes["service.namespace"], "usbharu-lab") where attributes["service.name"] == "worker"
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  otlphttp/mimir:
    endpoint: http://mimir:9009/otlp
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
                without_units: true
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp, prometheus/pve, prometheus/vms, prometheus/lgtm]
      processors: [memory_limiter, transform/remote_worker, batch]
      exporters: [otlphttp/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/remote_worker, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/remote_worker, batch]
      exporters: [otlp/tempo]
