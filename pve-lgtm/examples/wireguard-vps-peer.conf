# Append this peer to the existing /etc/wireguard/wg0.conf on ocms-ubuntu.
# Do not replace the file: it already contains the VPN hub and other peers.
#
# Apply without restarting the interface:
#   wg set wg0 peer <PVE2_PUBLIC_KEY> allowed-ips 10.0.0.3/32,192.168.1.240/32
#   ip route replace 192.168.1.240/32 dev wg0
#
# wg-quick adds the 192.168.1.240/32 route from AllowedIPs on the next boot.
[Peer]
# pve2 usbharu-lab
PublicKey = <PVE2_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32, 192.168.1.240/32
