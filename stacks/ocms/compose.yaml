name: ocms
services:
  catalog:
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      CATALOG_URL: http://catalog:8080
      MEDIA_MAX_PDF_PAGES: ${MEDIA_MAX_PDF_PAGES:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      SERVICE: catalog
      MEDIA_URL: http://worker:8080
      DATABASE_URL: postgres://ocms_catalog:${CATALOG_DB_PASSWORD}@192.168.1.253:5434/ocms?sslmode=prefer
    ports:
    - 192.168.1.254:18081:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    networks:
      default: {}
  transfer:
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      CATALOG_URL: http://catalog:8080
      MEDIA_MAX_PDF_PAGES: ${MEDIA_MAX_PDF_PAGES:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      SERVICE: transfer
      MEDIA_URL: http://worker:8080
      DATABASE_URL: postgres://ocms_transfer:${TRANSFER_DB_PASSWORD}@192.168.1.253:5434/ocms?sslmode=prefer
      CRYPTO_CONFIG: /run/secrets/crypto.yaml
      S3_ENDPOINT: 76906b4e38909e314e89939ec9f8e485.r2.cloudflarestorage.com
      S3_ACCESS_KEY: ${R2_ACCESS_KEY_ID:?Configure R2 credentials}
      S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:?Configure R2 credentials}
      S3_TLS: 'true'
      S3_BUCKET: ocms-data
    ports:
    - 192.168.1.254:18082:8080
    volumes:
    - /etc/komodo/secrets/ocms/crypto.yaml:/run/secrets/crypto.yaml:ro
    depends_on:
      catalog:
        condition: service_healthy
    mem_limit: 128m
    networks:
      default: {}
  search:
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      CATALOG_URL: http://catalog:8080
      MEDIA_MAX_PDF_PAGES: ${MEDIA_MAX_PDF_PAGES:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      SERVICE: search
      DATABASE_URL: postgres://ocms_search:${SEARCH_DB_PASSWORD}@192.168.1.253:5434/ocms?sslmode=prefer
      MEDIA_URL: http://worker:8080
      RUNTIME_URL: http://runtime:8080
      SEMANTIC_SEARCH_ENABLED: false
      RECOMMENDATION_URL: http://recommender:8080
    ports:
    - 192.168.1.254:18083:8080
    depends_on:
      catalog:
        condition: service_healthy
      recommender:
        condition: service_healthy
    mem_limit: 128m
    networks:
      default: {}
  runtime:
    image: ghcr.io/usbharu/ocms-runtime:v0.13.0-cpu
    pull_policy: missing
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INFERENCE_DTYPE: ${INFERENCE_DTYPE:-float32}
      INFERENCE_THREADS: '2'
      WEB_CONCURRENCY: '1'
    ports:
    - 192.168.1.254:18084:8080
    volumes:
    - models:/models
    tmpfs:
    - /tmp:rw,size=512m,mode=1777
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on: {}
    mem_limit: 2g
    memswap_limit: 8g
    cpus: 1.5
    networks:
      default: {}
  worker:
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      CATALOG_URL: http://catalog:8080
      MEDIA_MAX_PDF_PAGES: ${MEDIA_MAX_PDF_PAGES:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      SERVICE: worker
      DATABASE_URL: postgres://ocms_media:${MEDIA_DB_PASSWORD}@192.168.1.253:5434/ocms?sslmode=prefer
      TRANSFER_URL: http://transfer:8080
      SEARCH_URL: http://search:8080
      RUNTIME_URL: http://runtime:8080
      MEDIA_JOB_TIMEOUT_SECONDS: ${MEDIA_JOB_TIMEOUT_SECONDS:-7200}
      MEDIA_WORKER_CONCURRENCY: '3'
      MEDIA_PDF_PAGE_CONCURRENCY: '2'
      SEMANTIC_SEARCH_ENABLED: false
    tmpfs:
    - /tmp:rw,size=1536m,mode=1777
    mem_limit: 1536m
    cpus: 2
    depends_on:
      transfer:
        condition: service_healthy
      search:
        condition: service_healthy
      runtime:
        condition: service_healthy
    memswap_limit: 3072m
    networks:
      default: {}
  bff:
    labels:
      dev.usbharu.gitops.repository: https://github.com/usbharu/usbharu-lab
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      CATALOG_URL: http://catalog:8080
      MEDIA_MAX_PDF_PAGES: ${MEDIA_MAX_PDF_PAGES:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      SERVICE: bff
      TRANSFER_URL: http://transfer:8080
      SEARCH_URL: http://search:8080
      MEDIA_URL: http://worker:8080
      AUTH_MODE: oidc
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
    - 192.168.1.254:${OCMS_PORT:-8080}:8080
    depends_on:
      transfer:
        condition: service_healthy
      search:
        condition: service_healthy
    mem_limit: 128m
    networks:
      default: {}
  migrate:
    image: ghcr.io/usbharu/ocms:v0.13.0
    pull_policy: missing
    restart: 'no'
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    command:
    - migrate
    - up
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://ocms_migrate:${OCMS_MIGRATE_PASSWORD}@192.168.1.253:5434/ocms?sslmode=prefer
      APP_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Configure host ocms.env}
      MIGRATIONS_DIR: /app/migrations
    mem_limit: 128m
  recommender:
    image: ghcr.io/usbharu/ocms-runtime:v0.13.0-cpu
    command:
    - uvicorn
    - recommendation_server:app
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --no-access-log
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      DEPLOYMENT_ENVIRONMENT: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Configure host ocms.env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.1.254:4318
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    tmpfs:
    - /tmp:rw,size=64m,mode=1777
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')
      interval: 10s
      timeout: 5s
      retries: 30
    pull_policy: missing
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 0.5
    networks:
      default: {}
volumes:
  models: {}
