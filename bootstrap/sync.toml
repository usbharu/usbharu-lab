# Git is authoritative. Secret values remain in Komodo / on the host.
[[resource_sync]]
name = "usbharu-lab"
tags = ["usbharu-lab"]
[resource_sync.config]
repo = "usbharu/usbharu-lab"
branch = "komodo"
git_provider = "github.com"
resource_path = ["komodo"]
managed = false
delete = false
include_resources = true
include_variables = false
include_user_groups = false
match_tags = ["usbharu-lab"]
pending_alert = false
webhook_enabled = false
